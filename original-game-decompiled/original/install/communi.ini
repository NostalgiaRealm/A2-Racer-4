; testmessages (true/false) == werkt alleen als - testmode = true - ipv. online debuginfo over de messagequeue kun je nu door alle messages scrollen
; moveaway (true/false) == als er niks te melden is dan verdwijnt de communicator, hij komt weer terug bij nieuws
; moveawaytime == tijd (sec) die gewacht moet worden voordat communicator verdwijnt
; initwaittime == tijd (sec) voordat de communicator + overlay in beeld schuift bij start (wordt niet gebruikt)
; chars_per_line == aantal karakters per regel (in communicator). Een lange zin wordt afgebroken voor het laatste woord dat hier niet meer binnen past

