[SYSTEM]
;
; System messages zijn eigenlijk alleen events.
; Verschil met gewone messages is dat een system message gelijk wordt uitgevoerd
;
; SYSTEM_COPALERT = zet copalert lampje aan
;
; Identifier (string) - Dit is de identifier van het berichtje, het moet uniek zijn per karakter
; samplenr (int) - sample die wordt afgespeeld bij verschijnen van het berichtje (-1 = geen sample). Zie SAMPLES hierboven
; eventnr (int) - welk event wordt getriggerd door deze message
;		   0 = niks
;		   1 = copalert lampje op speedometer gaat aan (warninglevel = afhankelijk van mate van aanroep)
;		   2 = richtingaanwijzer (naar links) gaat aan
;		   3 = richtingaanwijzer (naar rechts) gaat aan
;		   4 = richtingaanwijzer (naar links & naar rechts) gaat aan
;		   5 = richtingaanwijzer (zigzag bocht) gaat aan
;		   [MAE 26-09-2000] Added new event
;		   6 = new message shown in communicator
;
0=copalert,    1,1
1=goleft,     -1,2
2=goright,    -1,3
3=gofork,     -1,4
4=gozigzag,   -1,5
5=newmessage,  0,6

