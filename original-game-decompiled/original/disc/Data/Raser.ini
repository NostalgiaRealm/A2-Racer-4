
;********************HELPDESK********************
[HELPDESK]

;================================================
; Enables output of special messages and errors
; to debug.txt file
;================================================
DEBUGON=0

;================================================
; Enables special features:
; Tweak menu/extra camera's/framerate printing.
;================================================
TWEAK_MODE=0


;********************MOVIES********************
[MOVIES]

;================================================
; Select '1' to view smacker movies fullscreen,
; or 0 to view them halfscreen.
;================================================
SIZE=0


;================================================
; Enables or disables smacker movies.
;================================================
ON=0


;********************PROGRAM*********************
[PROGRAM]

;================================================
; Program version, shown in options menu.
;================================================
VERSION=1.01

;================================================
; Application name
;================================================
NAME=A2 Racer IV

;================================================
; Resolution the menu saves when starting:
; 0=320x200x8
; 1=640x480x8
; 3=640x480x16
; 4=800x600x16
; 6=320x200x16
; 7=1024x768x16
; 8=1280x1024x16
; 9=1600x1200x16
;================================================
RESOLUTION=3

;================================================
; Selects the focus to render to:
; 0=BACK_SCREEN	(video memory)
; 1=BUFFER_SCREEN (system memory)
;================================================
FOCUS=1

;================================================
; Run in a window yes/no (Do NOT use on Voodoo1 
; or VooDoo2 systems
;================================================
WINDOWED=0

;********************MOUSE***********************
[MOUSE]

;================================================
; Read in gm_body ( skelet2d_get_mouse_type() )
; Not used!
;================================================
TYPE=1


;********************IMG*************************
[IMG]

;================================================
; Image file to retrieve data from.
;================================================
RCSFILE=rcs

;********************PALET***********************
[PALET]

;================================================
; Track specific palettes: first arg is the
; version for 8-bit mode, second is the version
; for 16-bit mode.
;================================================
ETAPPE0=e00_pal.pcx,e02_pl16.pcx
ETAPPE1=e02_pal.pcx,e02_pl16.pcx
ETAPPE2=e02_pal.pcx,e02_pl16.pcx
ETAPPE3=e02_pal.pcx,e02_pl16.pcx
ETAPPE4=e02_pal.pcx,e02_pl16.pcx
ETAPPE5=e02_pal.pcx,e02_pl16.pcx
ETAPPE6=e02_pal.pcx,e02_pl16.pcx
ETAPPE7=e02_pal.pcx,e02_pl16.pcx
ETAPPE8=e02_pal.pcx,e02_pl16.pcx
ETAPPE9=e00_pal.pcx,e02_pl16.pcx
ETAPPE10=e00_pal.pcx,e02_pl16.pcx
ETAPPE11=e00_pal.pcx,e02_pl16.pcx

;================================================
; Read in gm_body (skelet2d_get_show_palette())
; Not used!
;================================================
SHOW=0

;********************SOUND***********************
[SOUND]

;================================================
; Enables/disables all sound.
;================================================
ON=1

;================================================
; Number of sound buffers that can be played
; at once.
;================================================
BUFFERS=80


;================================================
; Music volume
; 0=off, 100=maximum
;================================================
MUSICVOLUME=90

;================================================
; Sound effects volume
; 0=off, 100=maximum
;================================================
SFXVOLUME=90

;================================================
; Police volume
; 0=off, 100=maximum
;================================================
POLICEVOLUME=99

;================================================

;********************MUSIC***********************
[MUSIC]

;================================================
; Music names
;================================================
0=M_DISCO1
1=M_MOBIE1
2=M_EIGHTY1
3=M_FUNKY1
4=M_MOBIE2
5=M_REVENGE1
count=6
LAST=2

;================================================
; Number of music files to be played.
;================================================
count=6

;********************MAPS************************
[MAPS]

;================================================
; Arg 0:
;       0=highway(snelweg), 1=city(stad)
; Arg 1:
;       Filenames for maps (without extension)
; Arg 2, 3, 4, 5:
;       Textures to load for map (without ext.)
; Arg 6:
;       Lores unaccelerated filename (without
;       extension) of the sky.
; Arg 7:
;       Hires unaccelerated filename (without
;       extension) of the sky.
; Arg 8:
;       Name of the track (shown in main menu)
; Arg 9:
;       Zero-based index in music array as
;       described above.
; Arg 10:
;       Timer (should be kept 10000!)
; Arg 11: 
;	Ambient lighting, intensity RED
; Arg 12:
; 	Ambient lighting, intensity GREEN
; Arg 13:
;	Ambient lighting, intensity BLUE
; Arg 14:
;	Track mode. Currently there are two modes:
;	0:	normal
;	1:	chase
;================================================
0=1,etappe0,e00_weg,e00_gras,e00_gra2,e00_vang,scrl_lo,scrl_hi,TRACK 0,0,10000,50,50,50,0
1=1,etappe1,e01_weg,e01_gras,e01_gra2,e01_vang,scrl_lo,scrl_hi,TRACK 1,5,10000,70,70,70,1
2=1,etappe2,e02_weg,e02_gras,e02_gra2,e02_vang,scrl_lo,scrl_hi,TRACK 2,0,10000,128,128,128,0
3=1,etappe3,e03_weg,e03_gras,e03_gra2,e03_vang,scrl_lo,scrl_hi,TRACK 3,0,10000,128,128,128,1
4=1,etappe4,e04_weg,e04_gras,e04_gra2,e04_vang,scrl_lo,scrl_hi,TRACK 4,1,10000,70,70,70,1
5=1,etappe5,e05_weg,e05_gras,e05_gra2,e05_vang,scrl_lo,scrl_hi,TRACK 5,3,10000,70,70,70,0
6=1,etappe6,e06_weg,e06_gras,e06_gra2,e06_vang,scrl_lo,scrl_hi,TRACK 6,4,10000,70,70,70,0
7=1,etappe7,e07_weg,e07_gras,e07_gra2,e07_vang,scrl_lo,scrl_hi,TRACK 7,0,10000,70,70,70,0
8=0,etappe8,e08_weg,e08_gras,e08_gra2,e08_vang,scrl_lo,scrl_hi,TRACK 8,0,10000,60,60,60,0
9=1,etappe9,e09_weg,e09_gras,e09_gra2,e09_vang,scrl_lo,scrl_hi,TRACK 9,0,10000,66,66,66,0
10=1,etappe10,e10_weg,e10_gras,e10_gra2,e10_vang,scrl_lo,scrl_hi,TRACK 10,0,10000,128,128,128,0
11=1,etappe11,e11_weg,e11_gras,e11_gra2,e11_vang,scrl_lo,scrl_hi,TRACK 11,0,10000,128,128,128,0

;================================================
; Number of tracks to read from ini-file.
;================================================
count=12

;********************PROGRESS********************
[progress]

;================================================
; Number of percents to read from ini-file.
; This value is written when "calculate" is
; enabled.
;================================================
COUNT=11

;================================================
; Enable recalc of progress bar percents.
; Should be done once to get correct
; percentages, then disabled to use these
; values for displaying the progress bar
;================================================
calculate=0

;================================================
; Percentages saved by game when "calculate" is
; enabled.
;================================================
percent0=10
percent1=20
percent2=30
percent3=40
percent4=50
percent5=60
percent6=60
percent7=70
percent8=80
percent9=90
percent10=100

