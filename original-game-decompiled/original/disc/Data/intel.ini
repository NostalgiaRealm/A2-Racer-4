;*****************GENERAL**********************
[GENERAL]

;==============================================
; Speed at which chased racer/player is stopped
; and arrested
;==============================================
StopSpeed=7

;==============================================
; Maximum cop chase time in easy mode
;==============================================
ChaseTimeEasy=120

;==============================================
; Maximum cop chase time in hard mode
;==============================================
ChaseTimeHard=120

;==============================================
; If the cop is this many chunks behind, he will
; stop the chase
;==============================================
GiveUpDist=20

;==============================================
; Maximum number of cops chasing the player in
; easy mode
;==============================================
CopsPerPlayerEasy=4

;==============================================
; Maximum number of cops chasing the player in
; hard mode
;==============================================
CopsPerPlayerHard=4

;==============================================
; Maximum number of cops per AI racer
;==============================================
CopsPerRacer=1

;==============================================
; Slow down factor when forced position down
;==============================================
SlowDownFactor=30

;==============================================
; Speed up factor when forced position up (no longer used)
;==============================================
SpeedUpFactor=25

;==============================================
; Speed penalty for racers in easy catch up close
;==============================================
CatchUpCloseEasy=20

;==============================================
; Speed penalty for racers in normal catch up close
;==============================================
CatchUpCloseNormal=5

;==============================================
; Speed penalty for racers in easy catch up far
;==============================================
CatchUpFarEasy=50

;==============================================
; Speed penalty for racers in normal catch up far
;==============================================
CatchUpFarNormal=35

;==============================================
; Chunk distance to activate catch up close easy
;==============================================
CatchUpCloseChunkEasy=15

;==============================================
; Chunk distance to activate catch up close normal
;==============================================
CatchUpCloseChunkNormal=20

;==============================================
; Chunk distance to activate catch up far
;==============================================
CatchUpFarChunk=40

;==============================================
; Minimum player speed to activate catch up
;==============================================
CatchUpSpeed=70

;==============================================
; Number of opponents in the game (max 6)
;==============================================
NrOpponents=4

;****************VIOLATIONS********************
[VIOLATIONS]

;==============================================
; Maximum speed on a 60 Km/h trigger
;==============================================
MaxSpeed60=50

;==============================================
; Maximum speed on a 80 km/h trigger
;==============================================
MaxSpeed80=70

;==============================================
; Maximum speed on a 120 km/h trigger
;==============================================
MaxSpeed120=100

;==============================================
; Maximum speed on a no max speed trigger
;==============================================
NoMaxSpeed=0

[STEERING BEHAVIOR]
;==============================================
; Minimum angle to start steering
;==============================================
MinAngle=0

;==============================================
; Maximum angle to steer to
;==============================================
MaxAngle=400

;==============================================
; Steering factor, used to bring the actual
; angle back to the steering angle.
;==============================================
SteerFactor=4

;**************RACER PENALTIES*****************
[RACER PENALTIES]

;==============================================
; Relative maximum speed for racer in league 0
;==============================================
MaxSpeedPenaltyEasy=90

;==============================================
; Relative maximum speed for racer in league 1
;==============================================
MaxSpeedPenaltyNormal=120

;==============================================
; Relative maximum speed for racer in league 2
;==============================================
MaxSpeedPenaltyHard=200

;==============================================
; Relative maximum RPM for racer in league 0
;==============================================
MaxRPMPenaltyEasy=115

;==============================================
; Relative maximum RPM for racer in league 1
;==============================================
MaxRPMPenaltyNormal=80

;==============================================
; Relative maximum RPM for racer in league 2
;==============================================
MaxRPMPenaltyHard=50
