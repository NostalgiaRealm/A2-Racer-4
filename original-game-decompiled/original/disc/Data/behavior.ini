;==========================================
; Agent types
;==========================================
[Agent Types]
0=Supercop0
1=Supercop1
Count=2

;==========================================
; Behaviors
;==========================================
[Behaviors]
0=Default
1=Friendly
2=Normal
3=Aggressive
Count=4

;==========================================
; Settings for default behavior
;==========================================
[Default]

; Used for the following:
; - Speed at which to slow down in front of target
; - Speed at which Supercop bashes into its target
; - Speed at which to drive forward/reverse when breaking free
Aggression=100

; Speed at which Supercop's vehicle speed up/slows down.
Acceleration=100

; Amount of risk to take driving through corners. Range is 0 - 100.
; When set to 0, the Supercop always drives at 'MaxCornerSpeed' (see below)
; through corners. Setting this to 100 makes the Supercop ignore corners
; when choosing driving speed. Any value between 0 and 100 makes the Supercop
; drive through corners faster, and therefor increases the risk of crashing.
; Works in conjunction with 'MaxCornerSpeed' (see below).
Risk=100

; Range in which Supercop can 'spot' targets, specified in number of chunks.
; The Supercop starts an attack when its target is within this range. Also,
; the 'cop alert' (communicator) is triggered when inside this range.
FrontVisibilityRange=12
RearVisibilityRange=8

; Maximum driving speed to use in corners, specified in km/hour.
; Decrease this setting when Supercop crashes when taking corners.
; Works in conjunction with 'Risk' (see above).
MaxCornerSpeed=220

; Preferred driving speed in patrol state when Supercop is ahead of target.
PatrolSpeed=30

; Attack behaviors are selected at random, but you can specify a relative preference.
; The settings work together in the following way; the higher a setting for a certain
; behavior with respect to the others, the more often it will be executed.
;
; Behavior 1:
;
; Pass target on left or right, stay in front of target and
; on the same lane, perform a handbrake turn or slow down.
;
; Behavior 2:
;
; Get besides target on left or right, stay alongside
; target, use megaphone and bash target sideways.
;
; Behavior 3:
;
; Stay in lane with target some distance behind vehicle.
; Bash into target from rear.
;
BehaviorBiases=24,64,64

; Chance that megaphone is used when Supercop is besides target.
; If set to 100, it will always be used.
MegaphoneFrequency=70

; To perform a handbrake turn/slow down in front of its target,
; The Supercop has to get in front first. When the Supercop is overtaking
; its target and is besides it, he can decide to bash into its target.
; The following setting defines the chance that this happens.
; 0 Means the Supercop never bashes into the target it is overtaking.
; When set to 100, bashing will always occur.
; Note: when set to 100, the chance of the Supercop getting in front of
; its target becomes smaller, reducing the change that a handbrake turn/
; slow down can be performed.
OvertakeBashFrequency=80

; Before making a handbrake turn/slowing down, the Supercop stays
; on the same lane in front of its target. The following setting defines
; the distance between the Supercop's vehicle and its target.
StayInLaneDistance=220

; When Supercop drives in front of target, it decides to either perform
; a handbrake turn or slow down. The following bias factor selects between
; these two actions. When set to 0, the Supercop performs a handbrake turn
; most of the time. A value of 100 makes it slow down. 50 means there is a
; 50/50 change of handbrake/slow down.
HandbrakeSlowDownBias=70

; Cheat settings
;
; If cheating is turned on, the Supercop's vehicle is placed 'CheatReplaceDistance'
; chunks behind the target (the player) if the distance between it and the target
; reaches 'CheatThreshHoldDistance' chunks.
;
; 'Cheat' is used to turn cheating on or off. 0 Turns it off,
; any value other than 0 turns cheating on.

Cheat=1
CheatThreshHoldDistance=10
CheatReplaceDistance=4

;==========================================
; Settings for behavior 'Friendly'
;==========================================
[Friendly]
Aggression=20
Acceleration=40
Risk=0
BehaviorBiases=64,64,64
MegaphoneFrequency=30
OvertakeBashFrequency=0
HandbrakeSlowDownBias=50

;==========================================
; Settings for behavior 'Normal'
;==========================================
[Normal]
Aggression=50
Acceleration=60
Risk=50
BehaviorBiases=64,64,64
MegaphoneFrequency=50
OvertakeBashFrequency=50
HandbrakeSlowDownBias=50
Cheat=0

;==========================================
; Settings for behavior 'Aggressive'
;==========================================
[Aggressive]
Aggression=100
Acceleration=100
Risk=100
BehaviorBiases=64,64,64
MegaphoneFrequency=80
OvertakeBashFrequency=80
HandbrakeSlowDownBias=100

